[bumpversion]
current_version = 0.4.5
commit = True
tag = True

[bumpversion:file:setup.py]
search = version="{current_version}"
replace = version="{new_version}"

[bumpversion:file:hlagenie/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bdist_wheel]
universal = 1

[flake8]
exclude = venv, .git, __pycache__, build, dist, docs

[tool:pytest]
testpaths = tests
markers =
    network: test needs internet the first time (downloads IMGT MSF files and builds the SQLite cache); runs offline once cached.
